[[projects]]
key = "example-web"
name = "示例项目"
category = "Workspace"
repo_path = "/path/to/example-web"
git_url = "http://git.example.com/group/example-web.git"

[projects.dev]
command = "npm run dev"

[projects.dev.env]
# PORT = "3000"

[projects.focus]
