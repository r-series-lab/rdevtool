[package]
name = "rdevtool-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rdevtool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
crossterm = "0.29.0"
eframe = "0.31.1"
percent-encoding = "2.3.2"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls", "socks"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tungstenite = "0.21.0"
toml = "0.9.8"
tray-icon = "0.19.2"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
