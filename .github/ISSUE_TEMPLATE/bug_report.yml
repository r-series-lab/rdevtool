name: Bug report
description: Report a reproducible rDevTool problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, internal URLs, business data, or complete private paths.
  - type: input
    id: version
    attributes:
      label: rDevTool version
      placeholder: 0.1.5
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux CLI, Other]
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: Apple Silicon, Intel, x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted diagnostics
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private URLs, business data, and personal paths.
          required: true
