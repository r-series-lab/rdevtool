name: Release preview desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-check:
    name: Validate release source
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Install Playwright Chromium
        run: cd web && npx playwright install chromium

      - name: Validate release version and documentation
        run: npm run release:check

      - name: Run full quality gate
        run: npm run check:full

  build:
    name: Build ${{ matrix.label }}
    needs: source-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Validate product contract
        run: npm run release:check && npm run manifest:check

      - name: Build Tauri package
        run: npm run build -- --target ${{ matrix.target }}

      - name: Generate artifact manifest and checksums
        run: npm run release:artifacts -- --target ${{ matrix.target }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdevtool-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/rdevtool-${{ matrix.target }}-release-artifacts.json
            target/${{ matrix.target }}/release/rdevtool-${{ matrix.target }}-SHA256SUMS.txt

  publish:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
          body: |
            Preview desktop packages. Each target includes platform-specific release metadata and SHA-256 checksums.

            macOS packages are ad-hoc signed but not Developer ID signed or notarized. Windows packages are not Authenticode signed. macOS Gatekeeper and Windows SmartScreen may show warnings.
